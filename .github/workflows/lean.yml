name: Lean

on:
  push:
    branches: [main]
    paths:
      - 'SuccessorTree/**'
      - 'SuccessorTree.lean'
      - 'scripts/*.lean'
      - 'scripts/check-axiom-log.py'
      - 'scripts/audit-envelope.sh'
      - 'tests/test_axiom_audit.py'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'SuccessorTree/**'
      - 'SuccessorTree.lean'
      - 'scripts/*.lean'
      - 'scripts/check-axiom-log.py'
      - 'scripts/audit-envelope.sh'
      - 'tests/test_axiom_audit.py'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        id: lake-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lake-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          if test -s lake-manifest.json; then
            echo 'Using existing pinned Lake manifest'
          else
            lake update
          fi
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Build
        run: |
          mkdir -p proof-audit
          if ! lake build > proof-audit/build.log 2>&1; then
            cat proof-audit/build.log
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path("proof-audit/build.log").read_text(encoding="utf-8")
          warnings = sum("warning:" in line for line in text.splitlines())
          hints = sum("Hint:" in line for line in text.splitlines())
          print(f"PASS: full build ({warnings} warning lines, {hints} hints; full log in artifact)")
          PY

      - name: Check shape Ramsey statement and axioms
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckShapeRamsey.lean > proof-audit/axioms.log 2>&1; then
            cat proof-audit/axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/axioms.log 8 || {
            cat proof-audit/axioms.log
            exit 1
          }
      - name: Check independent shape proof routes and finite corollaries
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckShapeProofRoutes.lean > proof-audit/shape-proof-routes.log 2>&1; then
            cat proof-audit/shape-proof-routes.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/shape-proof-routes.log 10 || {
            cat proof-audit/shape-proof-routes.log
            exit 1
          }
      - name: Check M2 B3 forbidden-copy case axioms
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckV10M2B3CopyCases.lean > proof-audit/m2-b3-copy-cases-axioms.log 2>&1; then
            cat proof-audit/m2-b3-copy-cases-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/m2-b3-copy-cases-axioms.log 3 || {
            cat proof-audit/m2-b3-copy-cases-axioms.log
            exit 1
          }
      - name: Check M2 B3 selected-source contradiction axioms
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckV10M2B3SelectedContradiction.lean > proof-audit/m2-b3-selected-axioms.log 2>&1; then
            cat proof-audit/m2-b3-selected-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/m2-b3-selected-axioms.log 1 || {
            cat proof-audit/m2-b3-selected-axioms.log
            exit 1
          }
      - name: Check M2 B3 prescribed socle age axioms
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckV10M2B3SocleAge.lean > proof-audit/m2-b3-socle-age-axioms.log 2>&1; then
            cat proof-audit/m2-b3-socle-age-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/m2-b3-socle-age-axioms.log 3 || {
            cat proof-audit/m2-b3-socle-age-axioms.log
            exit 1
          }
      - name: Check M2 typed boundary records and B1 axioms
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckV10M2BoundaryTypedRecords.lean > proof-audit/m2-boundary-records-axioms.log 2>&1; then
            cat proof-audit/m2-boundary-records-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/m2-boundary-records-axioms.log 3 || {
            cat proof-audit/m2-boundary-records-axioms.log
            exit 1
          }
      - name: Check M2 full boundary B2 and prescription axioms
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckV10M2BoundaryPrescribedB2.lean > proof-audit/m2-boundary-b2-axioms.log 2>&1; then
            cat proof-audit/m2-boundary-b2-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/m2-boundary-b2-axioms.log 4 || {
            cat proof-audit/m2-boundary-b2-axioms.log
            exit 1
          }
      - name: Check actual M2 boundary factorization criterion axioms
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckV10M2BoundaryFinalCriterion.lean > proof-audit/m2-boundary-final-axioms.log 2>&1; then
            cat proof-audit/m2-boundary-final-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/m2-boundary-final-axioms.log 3 || {
            cat proof-audit/m2-boundary-final-axioms.log
            exit 1
          }
      - name: Check M2 B3 actual upper source selection axioms
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckV10M2BoundaryUpperSelection.lean > proof-audit/m2-upper-selection-axioms.log 2>&1; then
            cat proof-audit/m2-upper-selection-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/m2-upper-selection-axioms.log 2 || {
            cat proof-audit/m2-upper-selection-axioms.log
            exit 1
          }
      - name: Test axiom-audit checker
        run: python3 -m unittest discover -s tests -p 'test_axiom_audit.py' -v
      - name: Check envelope section statements and axioms
        run: bash scripts/audit-envelope.sh proof-audit
      - name: Check fat-tree A1 sequencing axioms
        if: ${{ always() && !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p proof-audit
          if ! lake env lean scripts/CheckFatTreeA1.lean > proof-audit/fat-tree-a1-axioms.log 2>&1; then
            cat proof-audit/fat-tree-a1-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/fat-tree-a1-axioms.log 3 || {
            cat proof-audit/fat-tree-a1-axioms.log
            exit 1
          }
      - name: Check fat-tree structural statements and axioms
        if: ${{ always() && !cancelled() }}
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckFatTree.lean > proof-audit/fat-tree-axioms.log 2>&1; then
            cat proof-audit/fat-tree-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/fat-tree-axioms.log 14 || {
            cat proof-audit/fat-tree-axioms.log
            exit 1
          }
      - name: Check fat-tree A3 splice statements and axioms
        if: ${{ always() && !cancelled() }}
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckFatTreeA3.lean > proof-audit/fat-tree-a3-axioms.log 2>&1; then
            cat proof-audit/fat-tree-a3-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/fat-tree-a3-axioms.log 7 || {
            cat proof-audit/fat-tree-a3-axioms.log
            exit 1
          }
      - name: Check fat-tree A4 bridge axioms
        if: ${{ always() && !cancelled() }}
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckFatTreeA4.lean > proof-audit/fat-tree-a4-axioms.log 2>&1; then
            cat proof-audit/fat-tree-a4-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/fat-tree-a4-axioms.log 10 || {
            cat proof-audit/fat-tree-a4-axioms.log
            exit 1
          }
      - name: Check unconditional fat-tree A4 and Ellentuck endpoints
        if: ${{ always() && !cancelled() }}
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckFatTreeReviewA4.lean > proof-audit/fat-tree-review-a4-axioms.log 2>&1; then
            cat proof-audit/fat-tree-review-a4-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/fat-tree-review-a4-axioms.log 64 || {
            cat proof-audit/fat-tree-review-a4-axioms.log
            exit 1
          }
      - name: Check intermediate fat-tree replay axioms
        if: ${{ always() && !cancelled() }}
        run: |
          set -o pipefail
          mapfile -t targets < <(sed -n 's/^import //p' scripts/CheckFatTreeReplay.lean)
          if ! lake build "${targets[@]}" > proof-audit/fat-tree-replay-build.log 2>&1; then
            cat proof-audit/fat-tree-replay-build.log
            exit 1
          fi
          if ! lake env lean scripts/CheckFatTreeReplay.lean > proof-audit/fat-tree-replay-axioms.log 2>&1; then
            cat proof-audit/fat-tree-replay-axioms.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/fat-tree-replay-axioms.log 13 || {
            cat proof-audit/fat-tree-replay-axioms.log
            exit 1
          }
      - name: Check coverage and conditional assembly interface
        if: ${{ always() && !cancelled() }}
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckFatTreeFirstApplication.lean > proof-audit/fat-tree-first-application.log 2>&1; then
            cat proof-audit/fat-tree-first-application.log
            exit 1
          fi
          python3 scripts/check-axiom-log.py proof-audit/fat-tree-first-application.log 9 || {
            cat proof-audit/fat-tree-first-application.log
            exit 1
          }
          echo 'A4Assembly is deliberately conditional; A4ReviewComplete discharges FixedStemPigeonhole unconditionally.'
      - name: Check localized manuscript patches
        if: ${{ always() && !cancelled() }}
        run: |
          set -o pipefail
          python3 manuscript/make-validation-patches.py --reference \
            --output proof-audit/manuscript-patches | tee proof-audit/manuscript-patches.log
      - name: Seed shared pinned Lake cache only from a trusted branch run
        if: ${{ (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/formalize-v10-'))) && steps.lake-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
      - name: Record reproducible proof snapshot
        run: |
          git rev-parse HEAD > proof-audit/COMMIT
          cp lean-toolchain lakefile.toml lake-manifest.json proof-audit/
          git diff --check
          BASE=ef5cce3d9dcfea768c69998515a7ded6bc03e603
          MERGE_BASE="$(git merge-base origin/main HEAD)"
          printf '%s\n' "$BASE" > proof-audit/COMPLETION_BASE
          printf '%s\n' "$MERGE_BASE" > proof-audit/BRANCH_BASE
          git diff "$BASE" HEAD -- SuccessorTree.lean SuccessorTree scripts manuscript docs .github/workflows/lean.yml lakefile.toml > proof-audit/shape-ramsey-completion.patch
          git diff "$MERGE_BASE" HEAD -- SuccessorTree.lean SuccessorTree scripts manuscript docs .github/workflows/lean.yml lakefile.toml > proof-audit/shape-ramsey-branch.patch
          mkdir -p proof-audit/lean-progress-series
          git format-patch --quiet --output-directory proof-audit/lean-progress-series edf623cca331b08e1fc17fb3010d312714caf7c8..HEAD
          if test -d manuscript; then cp -R manuscript proof-audit/; fi
          if test -f docs/shape-ramsey-audit.md; then cp docs/shape-ramsey-audit.md proof-audit/; fi
          (cd proof-audit && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload proof audit and patches
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: shape-ramsey-proof-audit
          path: proof-audit/
          retention-days: 30
