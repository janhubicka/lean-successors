name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The GitHub runner is ephemeral. Cache the Lean toolchain separately from
      # lean-action's .lake cache so unchanged toolchains are not downloaded on
      # every CI run.
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      # lean-action installs elan, restores/saves .lake, downloads the Mathlib
      # binary cache when Mathlib is detected, and builds the project.
      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
