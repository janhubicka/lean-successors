name: Fat-tree source checkpoint

on:
  push:
    branches: [fat-tree-formalization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact sources independently of proof success
        run: |
          set -euo pipefail
          mkdir checkpoint
          git rev-parse HEAD > checkpoint/COMMIT
          git archive --format=tar.gz -o checkpoint/source.tar.gz HEAD
          git bundle create checkpoint/history.bundle HEAD
          git diff --check
          (cd checkpoint && sha256sum source.tar.gz history.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fat-tree-source-checkpoint
          path: checkpoint/
          retention-days: 14
