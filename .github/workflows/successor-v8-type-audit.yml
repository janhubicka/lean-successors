name: Successor v8 type audit

on:
  push:
    paths:
      - "scripts/successor_boring_type_validation.py"
      - "manuscript/annotate_successors_v8.py"
      - "docs/v8-envelope-and-boring-type-audit-20261008.md"
      - ".github/workflows/successor-v8-type-audit.yml"
      - "tests/test_v8_annotation.py"
  pull_request:
    paths:
      - "scripts/successor_boring_type_validation.py"
      - "manuscript/annotate_successors_v8.py"
      - "docs/v8-envelope-and-boring-type-audit-20261008.md"
      - ".github/workflows/successor-v8-type-audit.yml"
      - "tests/test_v8_annotation.py"

jobs:
  counterexample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts compile
        run: python3 -m py_compile scripts/successor_boring_type_validation.py manuscript/annotate_successors_v8.py
      - name: Verify boring-extension obstruction
        run: python3 scripts/successor_boring_type_validation.py
      - name: Verify annotation safety and idempotence
        run: python3 -m unittest discover -s tests -p 'test_v8_annotation.py' -v
