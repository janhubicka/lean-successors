name: Adversarial fat-tree A4

# Independent referees run weekly or on demand without blocking every
# unrelated Section 6 or abstract successor pull request.
on:
  schedule:
    - cron: '23 5 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/adversarial-fat-tree-a4.yml'
      - 'scripts/check-fat-tree-a4-firewall.py'

permissions:
  contents: read

concurrency:
  group: adversarial-fat-tree-a4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  referee:
    name: Independent endpoint, edge-case, and import-firewall referees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lake-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: |
          if test -s lake-manifest.json; then
            echo 'Using pinned Lake manifest'
          else
            lake update
          fi
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Build unconditional A4 and Ellentuck theorem
        run: lake build SuccessorTree.FatTree.A4ReviewComplete
      - name: Referee A — unconditional public endpoints and transitive axioms
        run: |
          set -euo pipefail
          lake env lean scripts/RefereeFatTreeA4A.lean > referee-a.log 2>&1 ||
            { cat referee-a.log; exit 1; }
          python3 scripts/check-axiom-log.py referee-a.log 4 ||
            { cat referee-a.log; exit 1; }
      - name: Referee B — moving roots, no-letter roots, and last blocks
        run: |
          set -euo pipefail
          lake env lean scripts/RefereeFatTreeA4B.lean > referee-b.log 2>&1 ||
            { cat referee-b.log; exit 1; }
          python3 scripts/check-axiom-log.py referee-b.log 6 ||
            { cat referee-b.log; exit 1; }
      - name: Referee C — geometric dependency/circularity firewall
        run: python3 scripts/check-fat-tree-a4-firewall.py
      - name: Record exact audit commit
        if: always()
        run: git rev-parse HEAD > A4-REFEREE-COMMIT
      - name: Retain adversarial referee evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fat-tree-a4-adversarial-audit
          path: |
            referee-a.log
            referee-b.log
            A4-REFEREE-COMMIT
          retention-days: 30
