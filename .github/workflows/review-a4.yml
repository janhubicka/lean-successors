name: Review A4
on:
  push:
    branches: [fat-tree-formalization, fat-tree-proof-cleanup]
    paths:
      - 'SuccessorTree.lean'
      - 'SuccessorTree/FatTree/A4PairPersistence.lean'
      - 'SuccessorTree/FatTree/A4Review*.lean'
      - 'scripts/CheckFatTreeReviewA4.lean'
      - 'docs/a4-review-proof.md'
      - 'manuscript/a4-review-validation.tex'
      - '.github/workflows/review-a4.yml'
  workflow_dispatch:
concurrency:
  group: review-a4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-a4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Build review proof
        run: |
          set -o pipefail
          mkdir -p review-a4-audit
          mapfile -t targets < <(sed -n 's/^import //p' scripts/CheckFatTreeReviewA4.lean)
          test "${#targets[@]}" -gt 0
          if ! lake build "${targets[@]}" > review-a4-audit/build.log 2>&1; then
            cat review-a4-audit/build.log
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path("review-a4-audit/build.log").read_text(encoding="utf-8")
          warnings = sum("warning:" in line for line in text.splitlines())
          hints = sum("Hint:" in line for line in text.splitlines())
          print(f"PASS: review proof built ({warnings} warning lines, {hints} hints; full log in artifact)")
          PY
      - name: Audit proof axioms
        run: |
          set -o pipefail
          if ! lake env lean scripts/CheckFatTreeReviewA4.lean > review-a4-audit/axioms.log 2>&1; then
            cat review-a4-audit/axioms.log
            exit 1
          fi
          expected="$(grep -c '^#print axioms ' scripts/CheckFatTreeReviewA4.lean)"
          test "$expected" -ge 14
          python3 scripts/check-axiom-log.py review-a4-audit/axioms.log "$expected" || {
            cat review-a4-audit/axioms.log
            exit 1
          }
      - name: Record exact source checkpoint
        if: always()
        run: |
          mkdir -p review-a4-audit
          git rev-parse HEAD > review-a4-audit/COMMIT
          git diff --check
          git diff 30ec322c69658f08b6cefde0696e0a7b72790b75 HEAD -- SuccessorTree.lean SuccessorTree/FatTree scripts/CheckFatTreeReviewA4.lean manuscript docs .github/workflows/review-a4.yml > review-a4-audit/review-a4.patch
          cp lean-toolchain lakefile.toml review-a4-audit/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-a4-audit
          path: review-a4-audit/
          retention-days: 30
