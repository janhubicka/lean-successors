name: Fat-tree to monoid projection

on:
  pull_request:
    paths:
      - 'SuccessorTree/FatTree/ProjectionTransfer.lean'
      - 'SuccessorTree/FatTree/ProjectionObstruction.lean'
      - 'scripts/CheckFatToMonoidProjection.lean'
      - 'scripts/CheckFatProjectionObstruction.lean'
      - '.github/workflows/fat-to-monoid-projection.yml'
      - 'scripts/check-fat-projection-free-ancestral-witness.py'
  push:
    branches: [main]
    paths:
      - 'SuccessorTree/FatTree/ProjectionTransfer.lean'
      - 'scripts/CheckFatToMonoidProjection.lean'
      - '.github/workflows/fat-to-monoid-projection.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lake-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: |
          if test -s lake-manifest.json; then
            echo 'Using pinned Lake manifest'
          else
            lake update
          fi
      - name: Retrieve mathlib cache
        run: lake exe cache get
      - name: Check source integrity
        run: python3 scripts/check-successor-proof-integrity.py
      - name: Check finite free-ancestral obstruction
        run: python3 scripts/check-fat-projection-free-ancestral-witness.py
      - name: Build only projection endpoints
        run: lake build SuccessorTree.FatTree.ProjectionTransfer
      - name: Audit named transitive axioms
        run: |
          mkdir -p proof-audit
          lake env lean scripts/CheckFatToMonoidProjection.lean > proof-audit/fat-projection-axioms.log 2>&1 || {
            cat proof-audit/fat-projection-axioms.log
            exit 1
          }
          python3 scripts/check-axiom-log.py proof-audit/fat-projection-axioms.log scripts/CheckFatToMonoidProjection.lean
      - name: Check noncontinuity obstruction criterion
        run: |
          lake build SuccessorTree.FatTree.ProjectionObstruction
          lake env lean scripts/CheckFatProjectionObstruction.lean > proof-audit/fat-projection-obstruction-axioms.log 2>&1 || {
            cat proof-audit/fat-projection-obstruction-axioms.log
            exit 1
          }
          python3 scripts/check-axiom-log.py proof-audit/fat-projection-obstruction-axioms.log scripts/CheckFatProjectionObstruction.lean
      - name: Preserve proof audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fat-to-monoid-projection-audit
          path: proof-audit/
          if-no-files-found: ignore
