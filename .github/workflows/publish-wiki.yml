name: Publish successor wiki

on:
  gollum:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

concurrency:
  group: publish-successor-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documented revision
        uses: actions/checkout@v4
      - name: Check whether the Wiki Git repository is initialized
        id: wiki
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote "https://github.com/${GITHUB_REPOSITORY}.wiki.git" HEAD >/dev/null 2>&1; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Initialize the Wiki Home page once at https://github.com/${GITHUB_REPOSITORY}/wiki"
          fi
      - name: Publish source-controlled pages
        if: steps.wiki.outputs.initialized == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs/wiki
          preprocess: true
          strategy: clone
          disable-empty-commits: true
