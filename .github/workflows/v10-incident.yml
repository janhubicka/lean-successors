name: V10 complete incident trace

on:
  push:
    paths:
      - 'SuccessorTree/V10/HIncidentTrace.lean'
      - 'scripts/CheckV10Incident.lean'
      - '.github/workflows/v10-incident.yml'
  pull_request:
    paths:
      - 'SuccessorTree/V10/HIncidentTrace.lean'
      - 'scripts/CheckV10Incident.lean'
      - '.github/workflows/v10-incident.yml'
  workflow_dispatch:

concurrency:
  group: v10-incident-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  incident:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Build complete numerical incident trace
        run: lake build SuccessorTree.V10.HIncidentTrace
      - name: Audit all new theorem axioms
        run: |
          lake env lean scripts/CheckV10Incident.lean > v10-incident-axioms.log 2>&1 || { cat v10-incident-axioms.log; exit 1; }
          python3 scripts/check-axiom-log.py v10-incident-axioms.log scripts/CheckV10Incident.lean || { cat v10-incident-axioms.log; exit 1; }
