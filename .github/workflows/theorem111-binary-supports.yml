name: Theorem 1.11 Binary Supports

on:
  pull_request:
    paths:
      - 'SuccessorTree/Counterexample/BinarySupports.lean'
      - 'SuccessorTree/Counterexample/GreedySelection.lean'
      - 'scripts/CheckTheorem111BinarySupports.lean'
      - '.github/workflows/theorem111-binary-supports.yml'
  push:
    branches: [main]
    paths:
      - 'SuccessorTree/Counterexample/BinarySupports.lean'
      - 'SuccessorTree/Counterexample/GreedySelection.lean'
      - 'scripts/CheckTheorem111BinarySupports.lean'
      - '.github/workflows/theorem111-binary-supports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-binary-supports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject admissions / unverified axioms
        run: python3 scripts/check-successor-proof-integrity.py
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lake-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: |
          if test ! -s lake-manifest.json; then lake update; fi
          lake exe cache get
      - name: Prove explicit binary almost-disjoint supports
        run: |
          lake build SuccessorTree.Counterexample.BinarySupports SuccessorTree.Counterexample.GreedySelection
          lake env lean scripts/CheckTheorem111BinarySupports.lean > /tmp/binary-supports-axioms.log
          cat /tmp/binary-supports-axioms.log
          python3 scripts/check-axiom-log.py /tmp/binary-supports-axioms.log scripts/CheckTheorem111BinarySupports.lean
