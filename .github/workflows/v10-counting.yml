name: V10 counting audit

on:
  push:
    branches: [main]
    paths:
      - 'SuccessorTree/**'
      - 'scripts/CheckV10*.lean'
      - 'scripts/check_v10_*.py'
      - 'scripts/select-v10-checks.py'
      - 'scripts/run-v10-batches.py'
      - 'scripts/test_v10_batches.py'
      - 'scripts/audit-import-graph.py'
      - 'scripts/test_ci_audits.py'
      - 'scripts/check-axiom-log.py'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'SuccessorTree.lean'
      - '.github/workflows/v10-counting.yml'
  pull_request:
    paths:
      - 'SuccessorTree/**'
      - 'scripts/CheckV10*.lean'
      - 'scripts/check_v10_*.py'
      - 'scripts/select-v10-checks.py'
      - 'scripts/run-v10-batches.py'
      - 'scripts/test_v10_batches.py'
      - 'scripts/audit-import-graph.py'
      - 'scripts/test_ci_audits.py'
      - 'scripts/check-axiom-log.py'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'SuccessorTree.lean'
      - '.github/workflows/v10-counting.yml'
  workflow_dispatch:
  # Full transitive axiom audit daily; push/PR check only affected consumers.
  schedule:
    - cron: '19 2 * * *'

concurrency:
  group: v10-count-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  counting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # For PR synthetic merge commits, retain the base parent for diff.
          fetch-depth: 2
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned-dependency Lake cache
        id: lake-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lake-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Lake dependencies
        # The repository currently does not track lake-manifest.json.
        run: |
          if test -s lake-manifest.json; then
            echo 'Using existing pinned Lake manifest'
          else
            lake update
          fi
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Fast CI-helper and batching coverage regressions
        run: |
          python3 scripts/test_ci_audits.py
          python3 scripts/test_v10_batches.py
      - name: Select transitive V10 axiom checks and finite regressions
        id: scope
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/select-v10-checks.py --output-file "$GITHUB_OUTPUT"
      - name: Inventory library imports and potential dead proof branches
        run: python3 scripts/audit-import-graph.py --output successor-import-audit.json
      - name: Exhaustive H-block meet diagnostic
        if: ${{ steps.scope.outputs.h == 'true' }}
        run: python3 scripts/check_v10_meet_blocks.py
      - name: Independent H binary age regression
        if: ${{ steps.scope.outputs.h == 'true' }}
        run: python3 scripts/check_v10_h_age.py
      - name: Independent exact H E and free-level regression
        if: ${{ steps.scope.outputs.h == 'true' }}
        run: python3 scripts/check_v10_h_exact_e.py
      - name: Independent terminal Sigma letter age regression
        if: ${{ steps.scope.outputs.sigma == 'true' }}
        run: python3 scripts/check_v10_terminal_sigma.py
      - name: Generator-based complete directed H regression
        if: ${{ steps.scope.outputs.h == 'true' }}
        run: python3 scripts/check_v10_incident_trace.py
      - name: Independent M3 gated-clone E3 and induced-copy projection
        if: ${{ steps.scope.outputs.m3 == 'true' }}
        shell: bash
        run: python3 scripts/check_v10_m3_middle.py | tee v10-m3-middle-regression.json
      - name: Complete L+ record and actual prefix-meet regression
        if: ${{ steps.scope.outputs.meet == 'true' }}
        shell: bash
        run: python3 scripts/check_v10_actual_meet.py | tee v10-actual-meet-regression.json
      - name: Complete-record original-pool closure regression
        if: ${{ steps.scope.outputs.pool == 'true' }}
        shell: bash
        run: python3 scripts/check_v10_original_pool.py | tee v10-original-pool-regression.json
      - name: Independent guarded level-removal finite regression
        if: ${{ steps.scope.outputs.removal == 'true' }}
        run: python3 scripts/check_v10_level_removal.py
      - name: Build affected V10 proof modules
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t checks < v10-selected-checks.txt
          if test "${#checks[@]}" -eq 0; then
            echo 'No affected V10 axiom scripts' | tee v10-build.log
            exit 0
          fi
          mapfile -t targets < <(sed -nE 's/^import (SuccessorTree\.[A-Za-z0-9_.]+)$/\1/p' "${checks[@]}" | sort -u)
          test "${#targets[@]}" -gt 0
          lake build "${targets[@]}" 2>&1 | tee v10-build.log
      - name: Check affected v10 theorem axioms (bounded exact batches)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-v10-batches.py --checks-file v10-selected-checks.txt --jobs 2 --batch-size 8 --max-axioms 64
      - name: Seed shared Lake cache on main only
        if: ${{ github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
      - name: Retain V10 proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-actual-meet-audit
          path: |
            v10-build.log
            v10-selected-checks.txt
            v10-check-timings.json
            successor-import-audit.json
            scripts/audit-import-graph.py
            scripts/test_ci_audits.py
            scripts/run-v10-batches.py
            scripts/test_v10_batches.py
            scripts/v10_batches_generated/*.lean
            scripts/select-v10-checks.py
            v10-actual-meet-regression.json
            v10-original-pool-regression.json
            v10-m3-middle-regression.json
            scripts/check_v10_m3_middle.py
            CheckV10*-axioms.log
            scripts/CheckV10*.lean
            scripts/check_v10_actual_meet.py
            scripts/check_v10_original_pool.py
            SuccessorTree/V10/KptMeet*.lean
            SuccessorTree/V10/HActualMeet.lean
            SuccessorTree/V10/HFinite*.lean
            SuccessorTree/V10/ConcreteOriginalPool.lean
            SuccessorTree/V10/HClosureCharge.lean
            SuccessorTree/V10/Prescribed*.lean
            manuscript/v10-cumulative-validation-status.tex
            manuscript/update-v10-source.py
            manuscript/check-v10-source-updater.py
          retention-days: 14
