name: M2 source snapshot for local Lean debugging
on:
  pull_request:
    paths:
      - '.github/workflows/m2-source-export.yml'
      - 'SuccessorTree/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack Lean source only
        run: |
          tar -czf successor-m2-source.tar.gz             SuccessorTree SuccessorTree.lean scripts             lakefile.toml lean-toolchain
          sha256sum successor-m2-source.tar.gz > SOURCE-SHA256
      - name: Export snapshot
        uses: actions/upload-artifact@v4
        with:
          name: m2-source-checkout
          path: |
            successor-m2-source.tar.gz
            SOURCE-SHA256
          retention-days: 7
