name: Theorem 1.11 Lean counterexample

on:
  push:
    branches: [main]
    paths:
      - 'SuccessorTree/Counterexample/**'
      - 'scripts/CheckTheorem111Counterexample.lean'
      - '.github/workflows/theorem111-counterexample-lean.yml'
  pull_request:
    paths:
      - 'SuccessorTree/Counterexample/**'
      - 'scripts/CheckTheorem111Counterexample.lean'
      - '.github/workflows/theorem111-counterexample-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject unfinished proof / new axioms
        run: |
          python3 scripts/check-successor-proof-integrity.py
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lake-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download dependencies
        run: |
          if test ! -s lake-manifest.json; then lake update; fi
          lake exe cache get
      - name: Compile counterexample and check its axioms
        run: |
          lake build SuccessorTree.Counterexample.NowhereDense SuccessorTree.Counterexample.MaskCodes SuccessorTree.Counterexample.SupportRigidity SuccessorTree.Counterexample.Topology SuccessorTree.Counterexample.StretchHistory SuccessorTree.Counterexample.MarkedFusion SuccessorTree.Counterexample.RootMarkerRigidity
          lake env lean scripts/CheckTheorem111Counterexample.lean > theorem111-counterexample-axioms.log
          cat theorem111-counterexample-axioms.log
          python3 scripts/check-axiom-log.py theorem111-counterexample-axioms.log scripts/CheckTheorem111Counterexample.lean
