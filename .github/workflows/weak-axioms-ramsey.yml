name: Weak-axiom Ramsey core

on:
  push:
    branches: [weak-axioms-ramsey-first-20261018]
    paths:
      - 'SuccessorTree/Block/**'
      - 'SuccessorTree/FatTree/GappedBasic.lean'
      - 'SuccessorTree/FatTree/GappedReduction.lean'
      - 'scripts/CheckWeakBlockRamsey.lean'
      - '.github/workflows/weak-axioms-ramsey.yml'
      - 'lean-toolchain'
      - 'lakefile.toml'
  pull_request:
    paths:
      - 'SuccessorTree/Block/**'
      - 'SuccessorTree/FatTree/GappedBasic.lean'
      - 'SuccessorTree/FatTree/GappedReduction.lean'
      - 'scripts/CheckWeakBlockRamsey.lean'
      - '.github/workflows/weak-axioms-ramsey.yml'
  workflow_dispatch:

concurrency:
  group: weak-axioms-ramsey-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ramsey-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact source
        run: |
          mkdir -p proof-audit
          git rev-parse HEAD | tee proof-audit/COMMIT
          python3 scripts/check-successor-proof-integrity.py
      - uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lake-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install elan and resolve pinned dependencies
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          if ! test -s lake-manifest.json; then lake update; fi
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Build Ramsey core without the strong-tree import
        run: |
          set -o pipefail
          lake build SuccessorTree.Block.SeededPigeonhole SuccessorTree.Block.ParityFatObstruction SuccessorTree.Block.BranchFirstParityObstruction SuccessorTree.Block.MarkedCuts SuccessorTree.FatTree.GappedBasic SuccessorTree.Block.MarkedParityExact SuccessorTree.FatTree.GappedReduction SuccessorTree.Block.MarkedOddWordA4 SuccessorTree.Block.MarkedCutNonlocality 2>&1 | tee proof-audit/build.log
      - name: Check exact theorem axioms
        run: |
          set -o pipefail
          lake env lean scripts/CheckWeakBlockRamsey.lean 2>&1 | tee proof-audit/axioms.log
          python3 scripts/check-axiom-log.py proof-audit/axioms.log scripts/CheckWeakBlockRamsey.lean
          cp lean-toolchain lakefile.toml lake-manifest.json proof-audit/
          (cd proof-audit && sha256sum COMMIT axioms.log build.log lean-toolchain lakefile.toml lake-manifest.json > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weak-axioms-ramsey-core
          path: proof-audit/
          retention-days: 30
